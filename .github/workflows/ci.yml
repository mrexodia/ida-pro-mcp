name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv run ruff check src/ida_pro_mcp --exclude 'src/ida_pro_mcp/ida_mcp/zeromcp/*.py'
      - run: uv run ruff format --check src/ida_pro_mcp --exclude 'src/ida_pro_mcp/ida_mcp/zeromcp/*.py'

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv run pyright

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.idalib-http -t idalib-http-ci .
